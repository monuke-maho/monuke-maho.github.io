baseURL: https://monukedayo.cc/
languageCode: ja-jp
title: monuke-maho
theme: stack

outputs:
  home: ["html","rss"]

DefaultContentLanguage: ja

permalinks:
  blog: /blog/:slug/
  page: /:slug/

menu:
  main:
    - name: "Home"
      url: /
      weight: -1
      params:
        icon: "home"
    - name: "About"
      url: /about/
      weight: 10
      params:
        icon: "user"
    - name: "Posts"
      url: /blog/
      weight: 20
      params:
        icon: "archives"
  social:
    - name: "GitHub"
      url: https://github.com/monuke-maho
      params:
        icon: "brand-github"

params:
  dateFormat:
    published: 2006/01/02
    lastUpdated: 2006/01/02 15:04:05
  description: "もぬけのブログだ"
  rssFullContent: true
  mainSections:
    - blog
  sidebar:
    emoji: "🦐"
    subtitle: "もぬけのブログです。"
    avatar:
      enabled: true
      src: "image/icon.webp"
      local: true
  footer:
    since: 2026
  article:
    headingAnchor: true
    math: true
    toc: true
    readingTime: true
    license:
      enabled: true
      default: "CC BY-NC-SA 4.0"
  widgets:
    homepage:
      - type: "search"
      - type: "tag-cloud"
        params:
          limit: 10
      - type: "categories"
        params:
          limit: 10
      - type: "archives"
        params:
          limit: 10
    page:
      - type: "toc"

markup:
    goldmark:
        extensions:
            passthrough:
                enable: true
                delimiters:
                    block:
                        - - \[
                          - \]
                        - - $$
                          - $$
                    inline:
                        - - \(
                          - \)
        renderer:
            ## Set to true if you have HTML content inside Markdown
            unsafe: true
    tableOfContents:
        endLevel: 4
        ordered: true
        startLevel: 2
    highlight:
        noClasses: false
        codeFences: true
        guessSyntax: true
        lineNoStart: 1
        lineNos: true
        lineNumbersInTable: true
        tabWidth: 4